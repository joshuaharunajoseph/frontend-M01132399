<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lessons</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="header-container">
        <h1 class="site-title">lessons</h1>
      </div>
    </header>

    <main class="container">
      <div class="sort-section">
        <div class="sort-group">
          <span class="sort-label">Sort by:</span>
          <div class="sort-options">
            <label><input type="radio" value="subject" v-model="sortAttribute"> Subject</label>
            <label><input type="radio" value="location" v-model="sortAttribute"> Location</label>
            <label><input type="radio" value="price" v-model="sortAttribute"> Price</label>
            <label><input type="radio" value="space" v-model="sortAttribute"> Spaces</label>
          </div>
        </div>
      </div>

      <div class="lesson-grid">
        <div class="lesson-card" v-for="lesson in lessons" :key="lesson._id">
          <img class="lesson-card-image" :src="getImageUrl(lesson.image)" :alt="lesson.subject">
          <div class="lesson-card-body">
            <div class="lesson-header">
              <h3 class="lesson-subject">{{ lesson.subject }}</h3>
              <i :class="lesson.icon + ' lesson-icon'"></i>
            </div>
            <h3>{{ lesson.subject }}</h3>
            <ul class="lesson-details">
              <li><strong>Location:</strong> {{ lesson.location }}</li>
              <li><strong>Price:</strong> £{{ lesson.price }}</li>
              <li><strong>Spaces:</strong> {{ lesson.space }}</li>
            </ul>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="app.js"></script>
</body>
</html>
